<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div role="img" aria-label="{{ label }}" style="{{ wrap }}">
  <div style="{{ pat }}"></div>
  <sc-if value="{{ hasFace }}" hint-placeholder-val="{{ false }}">
    <div style="{{ plate }}">
      <div style="{{ eyes }}"><span style="{{ eyeL }}"></span><span style="{{ eyeR }}"></span></div>
      <span style="{{ mouth }}"></span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;n&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:23,&quot;tsType&quot;:&quot;number&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:48,&quot;min&quot;:24,&quot;max&quot;:240,&quot;tsType&quot;:&quot;number&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const n = (((parseInt(this.props.n ?? 0, 10) || 0) % 24) + 24) % 24;
    const s = Number(this.props.size ?? 48) || 48;
    const pals = [['var(--accent)','var(--bg)'],['var(--text)','var(--accent)'],['var(--surface-raised)','var(--accent)'],['var(--accent)','var(--text)']];
    const [A, B] = pals[(n + (n >= 12 ? 2 : 0)) % 4];
    const u = s / 6, z = s / 8, d = s / 4;
    const zig = [135,225,315,45].map((a,i)=>`linear-gradient(${a}deg, ${B} 25%, transparent 25%) ${i<2?-z:0}px 0/${2*z}px ${2*z}px`).join(',');
    const pats = [
      `repeating-linear-gradient(0deg, ${A} 0 ${u}px, ${B} ${u}px ${2*u}px)`,
      `repeating-linear-gradient(45deg, ${A} 0 ${u*.75}px, ${B} ${u*.75}px ${u*1.5}px)`,
      `radial-gradient(circle, ${B} 26%, transparent 28%) 0 0/${d}px ${d}px, ${A}`,
      `${zig}, ${A}`,
      `linear-gradient(90deg, ${A} 50%, ${B} 50%)`,
      `linear-gradient(135deg, ${A} 50%, ${B} 50%)`,
      `repeating-radial-gradient(circle, ${A} 0 ${u*.7}px, ${B} ${u*.7}px ${u*1.4}px)`,
      `conic-gradient(${A} 25%, ${B} 0 50%, ${A} 0 75%, ${B} 0) 0 0/${s/3}px ${s/3}px`,
      `radial-gradient(circle at 50% 110%, ${A} 48%, ${B} 49%)`,
      `conic-gradient(from 45deg, ${A} 0 25%, ${B} 0 50%, ${A} 0 75%, ${B} 0)`,
      `repeating-linear-gradient(90deg, ${A} 0 ${u}px, ${B} ${u}px ${u*1.35}px, var(--bg) ${u*1.35}px ${u*1.7}px, ${B} ${u*1.7}px ${u*2.05}px)`,
      `radial-gradient(circle, ${A} 22%, transparent 24%) 0 0/${d}px ${d}px, repeating-linear-gradient(0deg, ${B} 0 ${d/2}px, var(--surface-raised) ${d/2}px ${d}px)`
    ];
    const faceT = [1,2,0,3,1,3,2,0,3,1,0,2][(n + (n >= 12 ? 5 : 0)) % 12];
    const ink = '#15161A', P = Math.round(s * .5), e = Math.max(2, Math.round(P * .13)), lw = Math.max(1.5, P * .09);
    const eye = { width: e, height: e, borderRadius: 999, background: ink, display: 'block' };
    let mouth = { display: 'block', width: P * .36, height: P * .16, borderBottom: `${lw}px solid ${ink}`, borderRadius: '0 0 999px 999px', boxSizing: 'border-box' };
    if (faceT === 2) mouth = { display: 'block', width: e * 1.6, height: e * 1.6, border: `${Math.max(1.2, e * .45)}px solid ${ink}`, borderRadius: 999, boxSizing: 'border-box' };
    const sel = this.props.selected === true || this.props.selected === 'true';
    return {
      label: this.props.label ?? `Avatar ${n + 1}`,
      hasFace: faceT !== 0,
      wrap: { width: s, height: s, borderRadius: 999, position: 'relative', overflow: 'hidden', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, boxShadow: sel ? '0 0 0 3px var(--bg), 0 0 0 6px var(--accent)' : 'inset 0 0 0 1px rgba(0,0,0,.12)' },
      pat: { position: 'absolute', inset: 0, background: pats[n % 12] },
      plate: { position: 'relative', width: P, height: P, borderRadius: 999, background: '#F3F1EC', boxShadow: `0 0 0 ${Math.max(1, s * .03)}px ${ink}`, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: P * .07 },
      eyes: { display: 'flex', gap: Math.max(2, P * .2), alignItems: 'center' },
      eyeL: eye,
      eyeR: faceT === 3 ? { ...eye, width: e * 1.7, height: Math.max(1.5, e * .5), marginTop: e * .3 } : eye,
      mouth
    };
  }
}
</script>
</body>
</html>
