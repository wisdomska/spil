version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: preview
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the Node the app runs on (.nvmrc). Raise this with .nvmrc.
      - dependency-name: "@types/node"
        versions: [">=25"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: preview
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
