name: keepalive

# Supabase Free pauses a project after about a week without activity.
# /api/health runs `select 1`, which counts as activity.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        url:
          - https://spil-party.vercel.app/api/health
          - https://spil-party-preview.vercel.app/api/health
    steps:
      - name: Ping ${{ matrix.url }}
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 30 "${{ matrix.url }}"
