# One-off: adds the v1.7.0 and v1.8.0 release tags, which could not be pushed from the cloud
# session that made those releases. Removed again right after it runs.
name: tag releases

on:
  push:
    branches: [feat/setup-steps-w08vmu]
    paths: [.github/workflows/tag-releases.yml]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag the releases
        run: |
          git config user.name "wisdomska(senya)"
          git config user.email "wisdomska@gmail.com"
          while read -r tag sha; do
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists"
              continue
            fi
            git tag -a "$tag" "$sha" -m "$tag"
            git push origin "refs/tags/$tag"
          done <<'TAGS'
          v1.7.0 1d66eadce0e4b0ff84b8d15aa011cfcd7787685b
          v1.8.0 65410158c26b6e6b18342b719873a28477f3b3da
          TAGS
