name: ci

on:
  pull_request:
  push:
    branches: [main, preview]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorship:
    name: authorship
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject AI attribution in commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$HEAD"
          else
            RANGE="$BASE..$HEAD"
          fi
          status=0
          for sha in $(git rev-list "$RANGE"); do
            if ! git log -1 --format='%an <%ae>%n%cn <%ce>%n%B' "$sha" | node scripts/check-commit-msg.mjs; then
              echo "::error::commit $sha carries AI attribution"
              status=1
            fi
          done
          exit $status

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:copy
      - run: pnpm test --coverage
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://spil-party.vercel.app
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - name: Service-role key must not reach the client bundle
        run: |
          if grep -rl "SUPABASE_SERVICE_ROLE_KEY\|service_role" .next/static; then
            echo "::error::service role reference found in client bundle"; exit 1
          fi

  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start local Supabase
        run: supabase start -x imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor,storage-api
      - name: Reset database (migrations + seed)
        run: supabase db reset
      - name: pgTAP tests
        run: supabase test db
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Point the app at local Supabase
        run: |
          supabase status -o env > /tmp/sb.env
          . /tmp/sb.env
          {
            echo "APP_ENV=local"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "CRON_SECRET=ci-cron-secret"
          } >> "$GITHUB_ENV"
      - name: Build and start the app
        run: |
          pnpm build
          pnpm start > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health && break; sleep 2; done
      - name: No admin strings in public pages (SPIL-07)
        run: node scripts/check-public-html.mjs http://localhost:3000
      - name: API integration tests
        run: pnpm test:api
        env:
          API_BASE_URL: http://localhost:3000
      - name: App log on failure
        if: failure()
        run: tail -100 /tmp/next.log || true
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
