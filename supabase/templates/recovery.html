<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 32px;
      background: #f1f2f4;
      font-family: Geist, Arial, sans-serif;
      color: #15161a;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 20px;
        padding: 32px;
      "
    >
      <tr>
        <td
          style="
            font:
              800 32px/1 Arial,
              sans-serif;
            letter-spacing: -0.03em;
          "
        >
          SPIL
        </td>
      </tr>
      <tr>
        <td
          style="
            padding-top: 24px;
            font:
              600 18px/1.4 Arial,
              sans-serif;
          "
        >
          Your admin reset code
        </td>
      </tr>
      <tr>
        <td
          style="
            padding-top: 8px;
            font:
              400 16px/1.5 Arial,
              sans-serif;
            color: #5d5f69;
          "
        >
          Enter this code on the SPIL admin reset page. It expires in one hour.
        </td>
      </tr>
      <tr>
        <td
          style="
            padding-top: 24px;
            font:
              600 40px/1 &quot;Courier New&quot;,
              monospace;
            letter-spacing: 0.2em;
          "
        >
          {{ .Token }}
        </td>
      </tr>
      <tr>
        <td
          style="
            padding-top: 24px;
            font:
              400 14px/1.5 Arial,
              sans-serif;
            color: #5d5f69;
          "
        >
          Didn't ask for this? Ignore this email. Your password stays the same.
        </td>
      </tr>
    </table>
  </body>
</html>
